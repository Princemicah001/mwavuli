    <div class="main">

        <div class="page-header">
            <div>
                <h1>Projects</h1>
                <p>Create and manage portfolio projects.</p>
            </div>
            <button id="newProjectBtn" class="action-btn">+ New Project</button>
        </div>

        <div id="projectContainer" class="project-admin-grid"></div>

    </div>

    <div id="projectModal" class="modal hidden">
        <div class="modal-card">
            <h2 id="modalTitle">New Project</h2>
            <form id="projectForm">
                <input type="text" id="pTitle" placeholder="Project title" required>
                <input type="text" id="pLocation" placeholder="Location (optional)">
                <textarea id="pDescription" placeholder="Short description (optional)" rows="3"></textarea>
                <input type="hidden" id="pId">
                <div class="modal-actions">
                    <button type="button" id="cancelBtn">Cancel</button>
                    <button type="submit">Save</button>
                </div>
            </form>
        </div>
    </div>

    <div id="projectFilesModal" class="modal hidden">
        <div class="modal-card modal-card-wide">
            <h2 id="filesModalTitle">Project Files</h2>

            <form id="projectUploadForm" class="panel-form" enctype="multipart/form-data">
                <label for="pUploadTitle">Event title <span class="hint">(optional)</span></label>
                <input type="text" id="pUploadTitle" placeholder="e.g. Brian & Faith Wedding">

                <label for="pUploadLocation">Location <span class="hint">(optional)</span></label>
                <input type="text" id="pUploadLocation" placeholder="e.g. Nairobi">

                <label for="pUploadFiles">Add Photos / Videos</label>
                <input type="file" id="pUploadFiles" accept="image/*,video/*" multiple>
                <div id="pFileList" class="file-list"></div>
                <div class="progress-wrap" id="pProgressWrap" hidden>
                    <div class="progress-bar">
                        <div class="progress-fill" id="pProgressFill"></div>
                    </div>
                    <span class="progress-pct" id="pProgressPct">0%</span>
                    <span class="progress-status" id="pProgressStatus"></span>
                </div>
                <button type="submit" id="pSubmitBtn">Upload to Project</button>
                <p id="pMessage" class="form-msg"></p>
            </form>

            <div class="files-section">
                <h3>Current Files</h3>
                <div id="projectFilesGrid" class="project-files-grid"></div>
            </div>

            <div class="modal-actions">
                <button type="button" id="closeFilesBtn">Close</button>
            </div>
        </div>
    </div>
